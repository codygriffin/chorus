[package]
name = "chorus-node"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "chorus"
path = "src/main.rs"

[dependencies]
chorus-common = { path = "../chorus-common" }
chorus-codec = { path = "../chorus-codec" }
chorus-storage = { path = "../chorus-storage" }
chorus-txn = { path = "../chorus-txn" }
chorus-sql = { path = "../chorus-sql" }
chorus-pg = { path = "../chorus-pg" }
chorus-admin = { path = "../chorus-admin" }
chorus-consensus = { path = "../chorus-consensus" }
serde_json = "1.0.151"
toml = "1.1.2"
thiserror = "2.0.19"
rustls-pemfile = "=2.2.0"
tokio = { version = "1.48.0", features = ["macros", "rt", "signal", "time"] }

[dev-dependencies]
tempfile = "3.23.0"
rcgen = "=0.13.2"
