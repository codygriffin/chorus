[package]
name = "chorus-consensus"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chorus-common = { path = "../chorus-common" }
chorus-codec = { path = "../chorus-codec" }
chorus-storage = { path = "../chorus-storage" }
chorus-txn = { path = "../chorus-txn" }
chorus-redb = { path = "../chorus-redb" }
openraft = { version = "=0.9.25", default-features = false, features = ["serde", "storage-v2", "single-term-leader"] }
thiserror = "2.0.19"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "=0.11.0"
prost = "=0.13.5"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "sync", "time", "net"] }
tokio-stream = { version = "=0.1.19", features = ["net"] }
tonic = { version = "=0.12.3", default-features = false, features = ["transport", "codegen", "prost", "tls"] }

[dev-dependencies]
tempfile = "3.23.0"
rcgen = "=0.13.2"

[build-dependencies]
tonic-build = { version = "=0.12.3", default-features = false, features = ["transport", "prost"] }
