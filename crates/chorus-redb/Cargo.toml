[package]
name = "chorus-redb"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
openraft = { version = "=0.9.25", default-features = false, features = ["serde", "storage-v2", "single-term-leader"] }
redb = { version = "=4.1.0", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"

[dev-dependencies]
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = ["macros", "rt", "rt-multi-thread"] }
