syntax = "proto3";

package chorus.consensus.openraft;

// Every RPC carries this versioned, identity-bound envelope.  The payload is
// currently bounded JSON (see openraft_transport.rs); a canonical binary
// codec remains a release gap.
message Envelope {
  uint32 version = 1;
  bytes cluster_id = 2;
  uint64 cluster_incarnation = 3;
  uint64 source_node_id = 4;
  uint64 target_node_id = 5;
  bytes payload = 6;
}

service OpenRaftTransport {
  rpc Vote(Envelope) returns (Envelope);
  rpc AppendEntries(Envelope) returns (Envelope);
  rpc InstallSnapshot(Envelope) returns (Envelope);
  // Gateway RPCs let an authenticated follower forward an application
  // request to the current leader without exposing OpenRaft internals to the
  // SQL/PostgreSQL serving layers.
  rpc ClientWrite(Envelope) returns (Envelope);
  rpc ReadBarrier(Envelope) returns (Envelope);
  // Authenticated control-plane calls are deliberately separate from
  // application gateway domains. Membership changes are accepted only from
  // current voters and are routed through the leader at most once.
  rpc MembershipStatus(Envelope) returns (Envelope);
  rpc ChangeMembership(Envelope) returns (Envelope);
}
